name: Daily Contribution Sync

on:
  schedule:
    - cron: '0 */23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update Timestamp & Sync Build Version
        run: |
          node -e "
            const fs = require('fs');
            const file = 'version.json';
            const data = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')) : { version: 0 };
            data.buildDate = new Date().toISOString();
            data.version = (data.version || 0) + 1;
            data.status = 'active';
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          "

      - name: Step 1 - Your Green Square
        run: |
          git config --local user.name "MusawarAhmed"
          git config --local user.email "56961150+MusawarAhmed@users.noreply.github.com"
          git commit --allow-empty -m "maintain daily streak"
          git push

      - name: Step 2 - The Verified Badge (Bot Commit)
        uses: iarekylew00t/verified-bot-commit@v2
        with:
          message: "changes the version"
          files: |
            version.json
